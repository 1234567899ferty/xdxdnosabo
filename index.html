<script>
const paises = document.querySelectorAll(".pais");
const mensaje = document.getElementById("mensaje");

let paisSecreto = "";
let modoJugador = false;
let esRetoDiario = false;
let segundos = 0;
let minutos = 0;
let reloj = null;
let iniciado = false;
let juegoTerminado = false;
let vidas = 3;
let pistaUsada = false;

// =======================
// EFECTOS DE SONIDO (Web Audio API)
// =======================
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.2);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'win') {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.frequency.setValueAtTime(freq, now + idx * 0.08);
                g.gain.setValueAtTime(0.1, now + idx * 0.08);
                g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                o.start(now + idx * 0.08);
                o.stop(now + idx * 0.08 + 0.2);
            });
        } else if (type === 'hint') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        }
    } catch(e) {}
}

// =======================
// ESTADÍSTICAS & LOCALSTORAGE
// =======================
let stats = JSON.parse(localStorage.getItem("adivinaPaisStats_v22")) || {
    partidas: 0,
    victorias: 0,
    derrotas: 0,
    racha: 0,
    mejorRacha: 0,
    mejorTiempo: null
};

function actualizarUIStats() {
    document.getElementById("statPartidas").innerText = stats.partidas;
    document.getElementById("statVictorias").innerText = stats.victorias;
    document.getElementById("statDerrotas").innerText = stats.derrotas;
    document.getElementById("statRacha").innerText = stats.racha;
    document.getElementById("statMejorRacha").innerText = stats.mejorRacha;
    
    if (stats.mejorTiempo !== null) {
        let m = Math.floor(stats.mejorTiempo / 60);
        let s = stats.mejorTiempo % 60;
        document.getElementById("statMejorTiempo").innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
    } else {
        document.getElementById("statMejorTiempo").innerText = "--:--";
    }
}
actualizarUIStats();

function guardarStats() {
    localStorage.setItem("adivinaPaisStats_v22", JSON.stringify(stats));
    actualizarUIStats();
}

function actualizarVidasUI() {
    let corazones = "";
    for (let i = 0; i < 3; i++) {
        corazones += i < vidas ? "❤️" : "❌";
    }
    document.getElementById("contadorVidas").innerText = corazones;
}

// =======================
// FECHA LOCAL DE MÉXICO (YYYY-MM-DD)
// =======================
function getFechaMexico() {
    return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Mexico_City',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
    }).format(new Date());
}

// =======================
// PAÍS ALEATORIO
// =======================
document.getElementById("paisAleatorio").addEventListener("click", () => {
    playSound('click');
    let numero = Math.floor(Math.random() * paises.length);
    paisSecreto = paises[numero].innerText;
    document.getElementById("paisElegido").innerHTML = "🌎 País seleccionado:<br><br>" + paisSecreto;
    modoJugador = false;
    pistaUsada = false;
    document.getElementById("vidasContainer").style.display = "none";
});

// =======================
// ELEGIR MANUALMENTE (MODAL)
// =======================
document.getElementById("elegirManual").addEventListener("click", () => {
    playSound('click');
    const lista = document.getElementById("listaPaises");
    lista.innerHTML = "";
    paises.forEach(pais => {
        let opcion = document.createElement("option");
        opcion.value = pais.innerText;
        opcion.textContent = pais.innerText;
        lista.appendChild(opcion);
    });
    document.getElementById("ventanaPais").style.display = "block";
});

function seleccionarPais() {
    playSound('click');
    paisSecreto = document.getElementById("listaPaises").value;
    document.getElementById("paisElegido").innerHTML = "🌎 País elegido:<br><br>" + paisSecreto;
    document.getElementById("ventanaPais").style.display = "none";
    modoJugador = false;
    pistaUsada = false;
    document.getElementById("vidasContainer").style.display = "none";
}

function cerrarVentana() {
    playSound('click');
    document.getElementById("ventanaPais").style.display = "none";
}

// =======================
// MODO RETO DIARIO
// =======================
document.getElementById("retoDiario").addEventListener("click", () => {
    playSound('click');
    const hoy = getFechaMexico();
    const completadoKey = "retoDiario_completado_" + hoy;

    if (localStorage.getItem(completadoKey)) {
        mostrarModal("📅 Reto Diario Completado", "Ya jugaste el Reto Diario de hoy (" + hoy + "). ¡Vuelve mañana para un nuevo desafío!");
        return;
    }

    esRetoDiario = true;
    modoJugador = true;
    juegoTerminado = false;
    vidas = 3;
    pistaUsada = false;
    actualizarVidasUI();
    document.getElementById("vidasContainer").style.display = "block";
    
    let hash = 0;
    for (let i = 0; i < hoy.length; i++) {
        hash = hoy.charCodeAt(i) + ((hash << 5) - hash);
    }
    let index = Math.abs(hash) % paises.length;
    paisSecreto = paises[index].innerText;

    mensaje.innerHTML = "📅 Reto Diario (" + hoy + "). ¡Adivínalo!";
    document.getElementById("paisElegido").innerHTML = "🌎 Reto Diario Activo";
    
    reiniciarRelojBase();
    iniciarTiempo();
});

// =======================
// MODO UN JUGADOR
// =======================
document.getElementById("modoJugador").addEventListener("click", () => {
    playSound('click');
    esRetoDiario = false;
    modoJugador = true;
    juegoTerminado = false;
    vidas = 3;
    pistaUsada = false;
    actualizarVidasUI();
    document.getElementById("vidasContainer").style.display = "block";

    let numero = Math.floor(Math.random() * paises.length);
    paisSecreto = paises[numero].innerText;

    mensaje.innerHTML = "🤫 Hay un país secreto. ¡Tienes 3 vidas!";
    document.getElementById("paisElegido").innerHTML = "🌎 País secreto oculto";
    
    reiniciarRelojBase();
    iniciarTiempo();
});

// =======================
// SISTEMA DE PISTAS 💡
// =======================
document.getElementById("darPista").addEventListener("click", () => {
    if (!modoJugador || juegoTerminado) {
        playSound('error');
        mensaje.innerHTML = "⚠️ Activa el Modo Un Jugador o Reto Diario para pedir una pista.";
        return;
    }
    if (pistaUsada) {
        playSound('error');
        mensaje.innerHTML = "⚠️ Ya usaste tu pista en esta partida.";
        return;
    }

    pistaUsada = true;
    playSound('hint');

    // Limpiar emojis o símbolos para mostrar la letra inicial
    let nombreLimpio = paisSecreto.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, "").trim();
    let primeraLetra = nombreLimpio.charAt(0).toUpperCase();
    let longitud = nombreLimpio.length;

    mensaje.innerHTML = `💡 Pista: Empieza con la letra "<b>${primeraLetra}</b>" y tiene aprox. ${longitud} letras.`;
});

// =======================
// CLIC EN EL TABLERO
// =======================
paises.forEach(pais => {
    pais.addEventListener("click", () => {
        playSound('click');

        if (!modoJugador) {
            pais.classList.toggle("descartado");
            return;
        }

        if (juegoTerminado) return;

        if (!iniciado) {
            iniciarTiempo();
        }

        if (pais.innerText === paisSecreto) {
            // VICTORIA
            juegoTerminado = true;
            clearInterval(reloj);
            playSound('win');
            mensaje.innerHTML = "🎉 ¡Correcto! Era " + paisSecreto;
            pais.classList.add("brillo");

            stats.partidas++;
            stats.victorias++;
            stats.racha++;
            if (stats.racha > stats.mejorRacha) {
                stats.mejorRacha = stats.racha;
            }

            let tiempoTotalSegs = (minutos * 60) + segundos;
            if (stats.mejorTiempo === null || tiempoTotalSegs < stats.mejorTiempo) {
                stats.mejorTiempo = tiempoTotalSegs;
            }

            if (esRetoDiario) {
                const hoy = getFechaMexico();
                localStorage.setItem("retoDiario_completado_" + hoy, "true");
            }

            guardarStats();

            let m = minutos < 10 ? "0" + minutos : minutos;
            let s = segundos < 10 ? "0" + segundos : segundos;
            mostrarModal("🏆 ¡Victoria!", "¡Adivinaste el país secreto!<br>Tiempo: " + m + ":" + s + "<br>Racha actual: " + stats.racha);

        } else {
            // ERROR / RESTAR VIDA
            playSound('error');
            pais.classList.add("descartado");
            vidas--;
            actualizarVidasUI();

            if (vidas <= 0) {
                // DERROTA
                juegoTerminado = true;
                clearInterval(reloj);
                mensaje.innerHTML = "❌ ¡Game Over! Era " + paisSecreto;

                stats.partidas++;
                stats.derrotas++;
                stats.racha = 0;
                guardarStats();

                if (esRetoDiario) {
                    const hoy = getFechaMexico();
                    localStorage.setItem("retoDiario_completado_" + hoy, "true");
                }

                mostrarModal("❌ ¡Derrota!", "Te quedaste sin vidas.<br>El país secreto era: <b>" + paisSecreto + "</b><br>Tu racha se ha reiniciado a 0.");
            } else {
                mensaje.innerHTML = "❌ No es ese país. Te quedan " + vidas + " vidas.";
            }
        }

        setTimeout(() => {
            pais.classList.remove("brillo");
        }, 400);
    });
});

// =======================
// TEMPORIZADOR
// =======================
function iniciarTiempo() {
    if (iniciado) return;
    iniciado = true;

    reloj = setInterval(() => {
        segundos++;
        if (segundos == 60) {
            segundos = 0;
            minutos++;
        }

        let m = minutos < 10 ? "0" + minutos : minutos;
        let s = segundos < 10 ? "0" + segundos : segundos;

        document.getElementById("tiempo").innerHTML = "Tiempo: " + m + ":" + s;
    }, 1000);
}

function reiniciarRelojBase() {
    clearInterval(reloj);
    reloj = null;
    segundos = 0;
    minutos = 0;
    iniciado = false;
    document.getElementById("tiempo").innerHTML = "Tiempo: 00:00";
}

// =======================
// MODAL DE RESULTADO
// =======================
function mostrarModal(titulo, texto) {
    document.getElementById("tituloResultado").innerHTML = titulo;
    document.getElementById("textoResultado").innerHTML = texto;
    document.getElementById("modalResultado").style.display = "block";
}

function cerrarModalResultado() {
    playSound('click');
    document.getElementById("modalResultado").style.display = "none";
}

// =======================
// REINICIAR JUEGO MANUAL
// =======================
document.getElementById("reiniciar").addEventListener("click", () => {
    playSound('click');
    paises.forEach(pais => {
        pais.classList.remove("descartado");
        pais.classList.remove("brillo");
    });

    reiniciarRelojBase();
    juegoTerminado = false;
    modoJugador = false;
    esRetoDiario = false;
    paisSecreto = "";
    pistaUsada = false;

    document.getElementById("vidasContainer").style.display = "none";
    document.getElementById("paisElegido").innerHTML = "🌎 País seleccionado: Ninguno";
    document.getElementById("ventanaPais").style.display = "none";
    document.getElementById("modalResultado").style.display = "none";
    mensaje.innerHTML = "Modo libre";
});
</script>
