<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adivina el País</title>


<style>

body{

margin:0;
padding:0;

background:#000;
color:white;

font-family:Arial, Helvetica, sans-serif;

text-align:center;

}


h1{

font-size:clamp(30px,5vw,45px);

}



button{

padding:15px 25px;

margin:10px;

font-size:18px;

border-radius:10px;

border:2px solid white;

background:black;

color:white;

cursor:pointer;

}



button:hover{

background:white;

color:black;

}



#tiempo{

font-size:25px;

margin:20px;

}



#mensaje{

font-size:20px;

}



#tablero{


width:95%;

max-width:1200px;

margin:30px auto;


display:grid;

grid-template-columns:repeat(auto-fit,minmax(150px,1fr));

gap:12px;


}



.pais{


background:white;

color:black;


border:2px solid white;

border-radius:12px;


padding:18px;


font-size:20px;


cursor:pointer;


transition:.2s;


}



.pais:hover{

transform:scale(1.05);

}



.brillo{

animation:brillar .4s;

}



@keyframes brillar{


50%{

box-shadow:0 0 40px white;

}


}



.descartado{


background:#222 !important;

color:#888;


text-decoration:line-through;


opacity:.5;


}



@media(max-width:600px){


#tablero{

grid-template-columns:repeat(2,1fr);

}


.pais{

font-size:16px;

}


}


</style>


</head>



<body>


<h1>🌎 Adivina el País</h1>


<p>Descarta países hasta encontrar el correcto</p>



<button id="modoJugador">

</button>

</button>



<h2 id="mensaje">

</div>



<div id="tablero">


<button class="pais">🇲🇽 México</button>

</div>


<script>

const paises = document.querySelectorAll(".pais");

const mensaje = document.getElementById("mensaje");

let paisSecreto = "";

let modoJugador = false;


let segundos = 0;
let minutos = 0;

let reloj = null;
let iniciado = false;



// Activar modo un jugador

document.getElementById("modoJugador").addEventListener("click",()=>{


modoJugador = true;


let numero = Math.floor(Math.random()*paises.length);


paisSecreto = paises[numero].innerText;



mensaje.innerHTML = "🤫 Hay un país secreto. ¡Adivínalo!";


iniciarTiempo();


});


paises.forEach(pais=>{

pais.addEventListener("click",()=>{


if(!modoJugador){

pais.classList.toggle("descartado");
return;

}


if(pais.innerText === paisSecreto){

mensaje.innerHTML =
"🎉 ¡Correcto! Era " + paisSecreto;

clearInterval(reloj);


}else{


pais.classList.add("descartado");

mensaje.innerHTML =
"❌ No es ese país, sigue buscando";


}



pais.classList.add("brillo");


setTimeout(()=>{

pais.classList.remove("brillo");

},400);



if(!iniciado){

iniciarTiempo();

}


});


});

// Temporizador

function iniciarTiempo(){


if(iniciado) return;


iniciado = true;


reloj = setInterval(()=>{


segundos++;


if(segundos==60){

segundos=0;

minutos++;

}



let m = minutos < 10 ? "0"+minutos : minutos;

let s = segundos < 10 ? "0"+segundos : segundos;



document.getElementById("tiempo").innerHTML =

"Tiempo: "+m+":"+s;



},1000);



}






// Comprobar respuesta

function comprobar(){


let respuesta = prompt("¿Cuál crees que es el país?");



if(respuesta == paisSecreto){


mensaje.innerHTML =

"🎉 Correcto. Era "+paisSecreto;


}else{


mensaje.innerHTML =

"❌ Incorrecto. Sigue intentando";


}



}




// Reiniciar juego

document.getElementById("reiniciar").addEventListener("click",()=>{


paises.forEach(pais=>{


pais.classList.remove("descartado");

pais.classList.remove("brillo");


});



let numero = Math.floor(Math.random()*paises.length);


paisSecreto = paises[numero].innerText;



segundos=0;

minutos=0;


document.getElementById("tiempo").innerHTML=

"Tiempo: 00:00";



clearInterval(reloj);


reloj=null;


iniciado=false;


mensaje.innerHTML=

"🔄 Nueva partida";


});



</script>
