padding:15px 25px;

#paisElegido{

margin:25px auto;

#tablero{


width:95%;

max-width:1200px;

margin:30px auto;


display:grid;

grid-template-columns:repeat(auto-fit,minmax(150px,1fr));

gap:12px;


}



.pais{


background:white;

color:black;


border:2px solid white;

border-radius:12px;


padding:18px;


font-size:20px;


cursor:pointer;


transition:.2s;


}



.pais:hover{

transform:scale(1.05);

}



.brillo{

animation:brillar .4s;

}



@keyframes brillar{


50%{

box-shadow:0 0 40px white;

}


}



.descartado{


background:#222 !important;

color:#888;


text-decoration:line-through;


opacity:.5;


}



@media(max-width:600px){


#tablero{

grid-template-columns:repeat(2,1fr);

}


.pais{

font-size:16px;

}


}

<script>

const paises = document.querySelectorAll(".pais");

const mensaje = document.getElementById("mensaje");

let paisSecreto = "";

let modoJugador = false;

// =======================
// PAÍS ALEATORIO
// =======================
// PAÍS ALEATORIO
// =======================

document.getElementById("paisAleatorio").addEventListener("click",()=>{

    let numero = Math.floor(Math.random()*paises.length);

    paisSecreto = paises[numero].innerText;


    document.getElementById("paisElegido").innerHTML =
    "🌎 País seleccionado:<br><br>" + paisSecreto;

});

// =======================
// ELEGIR MANUALMENTE
// =======================

document.getElementById("elegirManual").addEventListener("click",()=>{

    let lista = "";

    paises.forEach((pais,i)=>{

        lista += (i+1) + ". " + pais.innerText + "\n";

    });

    let opcion = prompt(
        "Escribe el número del país:\n\n" + lista
    );

    opcion = parseInt(opcion);

    if(opcion>=1 && opcion<=paises.length){

        paisSecreto = paises[opcion-1].innerText;

        alert("✅ Tu país es:\n\n" + paisSecreto);

    }else{

        alert("Número inválido.");

    }

});

let segundos = 0;
let minutos = 0;

let reloj = null;
let iniciado = false;



// Activar modo un jugador

document.getElementById("modoJugador").addEventListener("click",()=>{


modoJugador = true;


let numero = Math.floor(Math.random()*paises.length);


paisSecreto = paises[numero].innerText;



mensaje.innerHTML = "🤫 Hay un país secreto. ¡Adivínalo!";


iniciarTiempo();


});


paises.forEach(pais=>{

pais.addEventListener("click",()=>{


if(!modoJugador){

pais.classList.toggle("descartado");
return;

}


if(pais.innerText === paisSecreto){

mensaje.innerHTML =
"🎉 ¡Correcto! Era " + paisSecreto;

clearInterval(reloj);


}else{


pais.classList.add("descartado");

mensaje.innerHTML =
"❌ No es ese país, sigue buscando";


}



pais.classList.add("brillo");


setTimeout(()=>{

pais.classList.remove("brillo");

},400);



if(!iniciado){

iniciarTiempo();

}


});


});

// Temporizador

function iniciarTiempo(){


if(iniciado) return;


iniciado = true;


reloj = setInterval(()=>{


segundos++;


if(segundos==60){

segundos=0;

minutos++;

}



let m = minutos < 10 ? "0"+minutos : minutos;

let s = segundos < 10 ? "0"+segundos : segundos;



document.getElementById("tiempo").innerHTML =

"Tiempo: "+m+":"+s;



},1000);



}






// Comprobar respuesta

function comprobar(){


let respuesta = prompt("¿Cuál crees que es el país?");



if(respuesta == paisSecreto){


mensaje.innerHTML =

"🎉 Correcto. Era "+paisSecreto;


}else{


mensaje.innerHTML =

"❌ Incorrecto. Sigue intentando";


}



}




// Reiniciar juego

document.getElementById("reiniciar").addEventListener("click",()=>{


paises.forEach(pais=>{


pais.classList.remove("descartado");

pais.classList.remove("brillo");


});



let numero = Math.floor(Math.random()*paises.length);


paisSecreto = paises[numero].innerText;



segundos=0;

minutos=0;


document.getElementById("tiempo").innerHTML=

"Tiempo: 00:00";



clearInterval(reloj);


reloj=null;


iniciado=false;

paisSecreto = "";


document.getElementById("paisElegido").innerHTML =
"🌎 País seleccionado: Ninguno";


document.getElementById("ventanaPais").style.display =
"none";


modoJugador = false;


mensaje.innerHTML = "";


clearInterval(reloj);

reloj = null;

segundos = 0;

minutos = 0;

iniciado = false;


document.getElementById("tiempo").innerHTML =
"Tiempo: 00:00";
});

// Abrir ventana
document.getElementById("elegirManual").addEventListener("click",()=>{

const lista=document.getElementById("listaPaises");

lista.innerHTML="";

paises.forEach(pais=>{

let opcion=document.createElement("option");

opcion.value=pais.innerText;

opcion.textContent=pais.innerText;

lista.appendChild(opcion);

});

document.getElementById("ventanaPais").style.display="block";

});


// Seleccionar país

function seleccionarPais(){

paisSecreto=document.getElementById("listaPaises").value;

document.getElementById("paisElegido").innerHTML=
"🌎 País elegido:<br><br>"+paisSecreto;

document.getElementById("ventanaPais").style.display="none";

}


// Cerrar ventana

function cerrarVentana(){

document.getElementById("ventanaPais").style.display="none";

}
